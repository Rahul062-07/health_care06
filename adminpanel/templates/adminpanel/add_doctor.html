{% extends 'main.html' %}
{% load static %}

{% block title %}About Us | Health Care{% endblock %}

{% block css %}
<link rel="stylesheet" href="{% static 'styles/admin.css' %}">
{% endblock %}

{% block content %}

<div class="admin-box">
    <h2>Add Doctor</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <input type="text" name="name" placeholder="Doctor Name" required><br><br>
        <input type="text" name="specialization" placeholder="Specialization" required><br><br>
        <input type="number" name="experience" placeholder="Experience (years)" required><br><br>
        <input type="file" name="image" required><br><br>

        <button type="submit">Save Doctor</button>
    </form>
</div>

{% endblock %}
