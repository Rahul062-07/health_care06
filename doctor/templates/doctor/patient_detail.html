{% extends 'main.html' %}
{% block content %}
<h1>Our Doctors</h1>
<div class="doctor-cards">
    {% for doc in doctors %}
    <div class="doctor-card">
        <img src="{{ doc.image.url }}" alt="{{ doc.user.get_full_name }}" width="150">
        <h3>{{ doc.user.get_full_name }}</h3>
        <p>Specialization: {{ doc.specialization }}</p>
        <p>Qualification: {{ doc.qualification }}</p>
        <p>Experience: {{ doc.experience }} yrs</p>
        <p>Rating: {{ doc.rating }}/5</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
