{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Mini Library</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            min-height: 100vh;
            background: linear-gradient(120deg, #1abc9c, #2c3e50);
        }

        
        .navbar{
            width: 100%;
            background-color: #2c3e50;
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar .logo{
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .navbar a{
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
            font-weight: bold;
        }

        .navbar a:hover{
            text-decoration: underline;
        }

        /* PAGE CENTERING */
        .signup-wrapper{
            min-height: calc(100vh - 56px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* SIGNUP CARD */
        .signup-container{
            background-color: #fff;
            width: 360px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.25);
        }

        .signup-container h2{
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .signup-container input{
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .signup-container input:focus{
            outline: none;
            border-color: #1abc9c;
        }

        .signup-container button{
            width: 100%;
            padding: 10px;
            background-color: #1abc9c;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .signup-container button:hover{
            background-color: #16a085;
        }

        .signup-container p{
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .signup-container a{
            color: #1abc9c;
            text-decoration: none;
            font-weight: bold;
        }

        .signup-container a:hover{
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <div class="logo">📚 Mini Library</div>
        <div>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'login' %}">Login</a>
        </div>
    </div>

    <!-- SIGNUP CONTENT -->
    <div class="signup-wrapper">
        <div class="signup-container">
            <h2>Create Account</h2>

            <form method="post">
                {% csrf_token %}

                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <input type="password" name="confirm" placeholder="Confirm Password" required>

                <button type="submit">Sign Up</button>
            </form>

            <p>
                Already have an account?
                <a href="{% url 'login' %}">Login</a>
            </p>
        </div>
    </div>

</body>
</html>
