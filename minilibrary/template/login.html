{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Mini Library</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            min-height: 100vh;
            background: linear-gradient(120deg, #3498db, #2c3e50);
        }

        /* NAVBAR */
        .navbar{
            width: 100%;
            background-color: #2c3e50;
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar .logo{
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .navbar a{
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
            font-weight: bold;
        }

        .navbar a:hover{
            text-decoration: underline;
        }

        /* LOGIN CONTAINER */
        .login-wrapper{
            min-height: calc(100vh - 56px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container{
            background-color: #fff;
            width: 360px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.25);
        }

        .login-container h2{
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .login-container input{
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .login-container input:focus{
            outline: none;
            border-color: #3498db;
        }

        .login-container button{
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .login-btn{
            background-color: #3498db;
        }

        .login-btn:hover{
            background-color: #2980b9;
        }

        .admin-btn{
            margin-top: 10px;
            background-color: #2c3e50;
        }

        .admin-btn:hover{
            background-color: #1f2d3a;
        }

        .login-container p{
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .login-container a{
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }

        .login-container a:hover{
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <div class="logo">📚 Mini Library</div>
        <div>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'signup' %}">Sign Up</a>
        </div>
    </div>

    <!-- LOGIN CONTENT -->
    <div class="login-wrapper">
        <div class="login-container">
            <h2>User Login</h2>

            <form method="post">
                {% csrf_token %}

                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>

                <button type="submit" class="login-btn">Login</button>
            </form>

            <a href="/admin/">
                <button type="button" class="admin-btn">Admin Login</button>
            </a>

            <p>
                Don't have an account?
                <a href="{% url 'signup' %}">Sign up</a>
            </p>
        </div>
    </div>

</body>
</html>{% load static %}
